<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mail.com Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #008000;
      --background-gradient: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      --form-bg: #ffffffee;
      --text-color: #003366;
      --btn-color: var(--primary-color);
      --btn-hover: #006400;
      --shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--background-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      background: #004788;
      padding: 20px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .header img {
      height: 40px;
    }

    .form-container {
      background: var(--form-bg);
      max-width: 420px;
      width: 90%;
      margin: 60px auto;
      padding: 35px 40px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      animation: fadeIn 0.6s ease;
    }

    .form-container h2 {
      color: var(--text-color);
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
      font-size: 1.5rem;
    }

    .error {
      color: red;
      text-align: center;
      display: none;
      margin-bottom: 15px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary-color);
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00b300, #008000);
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0,128,0,0.3);
      transition: all 0.3s ease-in-out;
    }

    .btn:hover {
      background: #006400;
      box-shadow: 0 6px 12px rgba(0,100,0,0.4);
      transform: scale(1.02);
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin: 40px 0 20px;
    }

    .verifying {
      display: none;
      text-align: center;
      margin-top: 60px;
      font-size: 1.2rem;
      color: #004788;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  
/* ===== Responsive Adjustments ===== */

/* Mobile (phones) */
@media (max-width: 767px) {
  .header {
    padding: 15px;
  }

  .header img {
    height: 32px;
  }

  .form-container {
    margin: 30px auto;
    padding: 25px 20px;
    max-width: 95%;
  }

  .form-container h2 {
    font-size: 1.25rem;
  }

  input[type="email"],
  input[type="password"],
  .btn {
    font-size: 1rem;
    padding: 12px;
  }

  .footer {
    font-size: 0.8rem;
    margin: 20px 0 10px;
  }
}

/* Tablet */
@media (min-width: 768px) and (max-width: 1024px) {
  .form-container {
    max-width: 500px;
    padding: 30px;
  }

  .form-container h2 {
    font-size: 1.4rem;
  }
}

/* Large desktop */
@media (min-width: 1440px) {
  .form-container {
    max-width: 500px;
  }
}

</style>
</head>
